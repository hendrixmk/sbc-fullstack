<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Photo Gallery — Singgimari Baptist Church</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/header.css">
  <style>
    body { background: #f0f2f5; }

    main { max-width: 960px; margin: 0 auto; padding: 2rem 1rem; }

    .page-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .page-topbar h2 {
      font-size: 1.3rem;
      font-weight: 800;
      color: #01143a;
      margin: 0;
    }

    .back-link {
      font-size: 0.85rem;
      font-weight: 600;
      color: #3b6fd4;
      text-decoration: none;
    }
    .back-link:hover { color: #1a3a6e; }

    /* Masonry-style grid using CSS grid */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
    }

    @media (max-width: 640px) { .gallery-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 380px) { .gallery-grid { grid-template-columns: 1fr; } }

    .gallery-item {
      border-radius: 10px;
      overflow: hidden;
      background: #fff;
      border: 1px solid #e0e4ed;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .gallery-item:hover { transform: scale(1.02); }

    .gallery-item img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }

    .gallery-caption {
      padding: 0.5rem 0.75rem;
      font-size: 0.78rem;
      color: #6b7280;
      margin: 0;
    }

    /* ── Lightbox ── */
    .lightbox-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    .lightbox-overlay.active { display: flex; }

    .lightbox-overlay img {
      max-width: 90vw;
      max-height: 80vh;
      border-radius: 8px;
      object-fit: contain;
    }

    .lightbox-caption {
      color: #e5e7eb;
      font-size: 0.9rem;
      margin-top: 0.75rem;
      text-align: center;
    }

    .lightbox-close {
      position: fixed;
      top: 1rem; right: 1.25rem;
      font-size: 2rem;
      color: #fff;
      background: none;
      border: none;
      cursor: pointer;
      line-height: 1;
    }

    .loading-text { color: #9ca3af; font-size: 0.9rem; padding: 1.5rem 0; text-align: center; }
    .spinner {
      display: inline-block; width: 16px; height: 16px;
      border: 2.5px solid #e5eeff; border-top-color: #3b6fd4;
      border-radius: 50%; animation: spin 0.7s linear infinite;
      vertical-align: middle; margin-right: 0.4rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- PASTE YOUR EXACT HEADER HERE — do not change it -->

  <main>
    <div class="page-topbar">
      <h2>📷 Photo Gallery</h2>
      <a href="blogs.html" class="back-link">← Back to Feed</a>
    </div>
    <div id="gallery-container" class="gallery-grid">
      <p class="loading-text"><span class="spinner"></span> Loading photos...</p>
    </div>
  </main>

  <!-- PASTE YOUR EXACT FOOTER HERE — do not change it -->

  <div class="lightbox-overlay" id="lightbox">
    <button class="lightbox-close" onclick="closeLightbox()">✕</button>
    <img id="lightbox-img" src="" alt="">
    <p class="lightbox-caption" id="lightbox-caption"></p>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
